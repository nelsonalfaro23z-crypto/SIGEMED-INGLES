<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGEMED - Verificar Código</title>
  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="Verificar Codigo.css">
</head>
<body>

  <div class="card-container">
    <!-- Ícono Superior -->
    <div class="header-icon">
      <i class="fa-solid fa-key"></i>
    </div>

    <!-- Título y Descripción -->
    <h2>Ingresa el código</h2>
    <p class="description">Hemos enviado un código de verificación de 6 dígitos a tu correo electrónico. <em>(Usa 123456 para probar)</em></p>

    <!-- Mensaje de Error si el código no coincide -->
    <div id="code-error" class="error-msg">Código incorrecto. Ingresa 123456 para continuar.</div>

    <!-- Formulario para ingresar el código -->
    <form class="verify-form" id="verifyForm">
      <div class="form-group">
        <label for="codigo">Código de Verificación:</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-shield-cat icon"></i>
          <input type="text" id="codigo" maxlength="6" placeholder="000000" required>
        </div>
      </div>

      <!-- Botón principal para validar -->
      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-check"></i> Verificar Código
      </button>

      <!-- Botón secundario para Cancelar -->
      <a href="Iniciar Sesión.html" class="btn-cancel">
        <i class="fa-solid fa-xmark"></i> Cancelar
      </a>
    </form>

    <!-- Enlace de Regreso a Iniciar Sesión -->
    <div class="back-link">
      <a href="Iniciar Sesión.html">
        <i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión
      </a>
    </div>

    <!-- Insignia de Seguridad Hospitalaria -->
    <div class="security-badge">
      <i class="fa-solid fa-shield-halved"></i>
      <div class="text">
        <span class="title">Acceso Seguro</span>
        <span class="sub">Tus datos están protegidos con encriptación de nivel hospitalario</span>
      </div>
    </div>
  </div>

  <!-- Lógica para validar el código fijo de 6 dígitos -->
  <script>
    document.getElementById('verifyForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const ingresado = document.getElementById('codigo').value.trim();
      const errorDiv = document.getElementById('code-error');

      // Validamos si el código ingresado es exactamente 123456
      if (ingresado === "123456") {
        errorDiv.style.display = "none";
        window.location.href = "Nueva Contraseña.html";
      } else {
        errorDiv.style.display = "block";
      }
    });
  </script>

</body>
</html>
