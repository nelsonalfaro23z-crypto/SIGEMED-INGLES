<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGEMED - Recuperar Contraseña</title>
  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="recuperar_contrasena.css">
</head>
<body>

  <div class="card-container">
    <!-- Ícono Superior -->
    <div class="header-icon">
      <i class="fa-solid fa-lock-open"></i>
    </div>

    <!-- Título y Descripción -->
    <h2>¿Olvidaste tu contraseña?</h2>
    <p class="description">Ingresa tu correo electrónico registrado para recibir un enlace de recuperación.</p>

    <!-- Formulario -->
    <form class="recover-form" action="Verificar Codigo.html" method="GET">
      <div class="form-group">
        <label for="correo">Correo Electrónico:</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope icon"></i>
          <input type="email" id="correo" placeholder="Ingresa tu correo electrónico" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-arrow-right"></i> Enviar Enlace
      </button>
    </form>

    <!-- Enlace de Regreso a Iniciar Sesión -->
    <div class="back-link">
      <a href="Iniciar Sesión.html">
        <i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión
      </a>
    </div>

    <!-- Insignia de Seguridad Hospitalaria -->
    <div class="security-badge">
      <i class="fa-solid fa-shield-halved"></i>
      <div class="text">
        <span class="title">Acceso Seguro</span>
        <span class="sub">Tus datos están protegidos con encriptación de nivel hospitalario</span>
      </div>
    </div>
  </div>

</body>
</html>
