<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGEMED - Nuevo Usuario</title>
  <link rel="stylesheet" href="Nuevo Usuario.css">
  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="main-wrapper">
    <div class="card-container">

      <!-- HEADER TOP INTERNO -->
      <header class="top-header">
        <button class="btn-back" id="btnBack" type="button">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <h1 class="title">Nuevo Usuario</h1>

        <div class="header-user">
          <div class="user-avatar-circle"><i class="fa-solid fa-user"></i></div>
          <div class="user-info">
            <span class="user-name">Administrador <i class="fa-solid fa-chevron-down"></i></span>
            <span class="user-role">Admin</span>
          </div>
        </div>
      </header>

      <!-- FORMULARIO DE NUEVO USUARIO -->
      <form id="newUserForm" class="user-form">

        <!-- Nombre completo -->
        <div class="form-group">
          <label for="fullName">Nombre completo</label>
          <input type="text" id="fullName" placeholder="Ingrese el nombre completo" required>
        </div>

        <!-- Usuario -->
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="Ingrese el nombre del usuario" required>
        </div>

        <!-- Correo Electrónico -->
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="Ingrese el correo electrónico" required>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Ingrese la contraseña" required>
        </div>

        <!-- Confirmar contraseña -->
        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <input type="password" id="confirmPassword" placeholder="Confirme la contraseña" required>
        </div>

        <!-- Fila Doble (Rol y Estado) -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="role">Rol</label>
            <div class="select-wrapper">
              <select id="role" required>
                <option value="" disabled selected>Seleccione un rol</option>
                <option value="Médico">Médico</option>
                <option value="Enfermera">Enfermera</option>
                <option value="Farmacéutico">Farmacéutico</option>
                <option value="Laboratorista">Laboratorista</option>
                <option value="Administrador">Administrador</option>
              </select>
              <i class="fa-solid fa-chevron-down select-icon"></i>
            </div>
          </div>

          <div class="form-group flex-1">
            <label for="status">Estado</label>
            <div class="select-wrapper">
              <select id="status" required>
                <option value="Activo" selected>Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
              <i class="fa-solid fa-chevron-down select-icon"></i>
            </div>
          </div>
        </div>

        <!-- BOTONES DE ACCIÓN -->
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="btnCancel">Cancelar</button>
          <button type="submit" class="btn-submit">Guardar usuario</button>
        </div>

      </form>

    </div>
  </div>

  <script src="Nuevo Usuario.js"></script>
</body>
</html>
